<!DOCTYPE html>
<html>
<head>
    <title>Crop Yield Prediction</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            text-align: center;
        }
        .box {
            width: 50%;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        input {
            padding: 8px;
            margin: 5px;
            width: 70%;
        }
        button {
            padding: 10px 20px;
            background: teal;
            color: white;
            border: none;
            border-radius: 5px;
        }
        .card {
            background: #e6fffa;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Crop Yield Prediction System</h2>

    <form method="POST">
        <input name="soil" placeholder="Soil Type (e.g., redsoil)" required><br>
        <input name="moisture" placeholder="Moisture (%)" required><br>
        <input name="temp" placeholder="Temperature (°C)" required><br>
        <input name="rainfall" placeholder="Rainfall (mm)" required><br>
        <input name="humidity" placeholder="Humidity (%)" required><br>
        <input name="sunlight" placeholder="Sunlight Hours" required><br><br>

        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
    <div class="card">
        <h3>Yield: {{prediction}} kg/hectare</h3>
        <p>Crop: {{selected_crop}}</p>
        <p>Price: ₹{{price}} /kg</p>
        <p>Cost: ₹{{cost}}</p>
        <p>Revenue: ₹{{revenue}}</p>
        <p>Profit: ₹{{profit}}</p>
    </div>
    {% endif %}

</div>

</body>
</html>
