<!DOCTYPE html>
<html>
<head>
    <title>Crop Yield Prediction</title>
    <style>
        body { font-family: Arial; text-align: center; background: #f2f2f2; }
        .box { background: white; padding: 20px; margin: 40px auto; width: 400px; border-radius: 10px; }
        input { width: 90%; padding: 8px; margin: 5px; }
        button { padding: 10px 20px; background: teal; color: white; border: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>Crop Yield Prediction</h2>

    <form method="POST">
        <input name="soil_type" placeholder="Soil Type"><br>
        <input name="moisture" placeholder="Soil Moisture"><br>
        <input name="temperature" placeholder="Temperature"><br>
        <input name="rainfall" placeholder="Rainfall"><br>
        <input name="humidity" placeholder="Humidity"><br>
        <input name="sunlight" placeholder="Sunlight"><br>

        <button type="submit">Predict</button>
    </form>

    {% if result %}
        <h3>Yield: {{ result }} kg/hectare</h3>
    {% endif %}

    {% if crops %}
        <h3>Top Suggested Crops:</h3>
        {% for c in crops %}
            <p>{{ c.crop_type }}</p>
        {% endfor %}
    {% endif %}
</div>

</body>
</html>
